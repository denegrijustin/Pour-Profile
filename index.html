<!doctype html>
<html lang="en">
  <head>
    <script>if (location.protocol === "http:" && location.hostname !== "localhost") location.replace(location.href.replace("http:", "https:"));</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1d5878">
    <title>Pour Decisions</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="app">
      <div id="offlineBanner" class="offline-banner" hidden>You're offline — showing your last synced collection. Pours you log now will sync when you're back online.</div>

      <header class="topbar">
        <div>
          <p class="eyebrow" id="topbarEyebrow">Pour Decisions</p>
          <h1 id="topbarTitle">Home</h1>
        </div>
        <div class="topbar-actions" id="topbarActions">
          <button class="profile-chip" id="profileChip" type="button" aria-label="Switch profile">
            <span id="profileChipName">Spirits</span> <span aria-hidden="true">▾</span>
          </button>
          <button class="icon-btn" data-action="open-search" aria-label="Search" type="button">🔍</button>
        </div>
      </header>

      <main id="views">
        <section id="view-home" class="view" aria-labelledby="topbarTitle"></section>
        <section id="view-spirits" class="view"></section>
        <section id="view-scan" class="view"></section>
        <section id="view-discover" class="view"></section>
        <section id="view-map" class="view"></section>
        <section id="view-profile" class="view"></section>
        <section id="view-wine" class="view"></section>
        <section id="view-bottle" class="view"></section>
        <section id="view-compare" class="view"></section>
        <section id="view-store-mode" class="view"></section>
      </main>

      <nav class="bottom-nav" aria-label="Primary">
        <button class="nav-btn" data-nav="home" type="button"><span class="nav-icon" aria-hidden="true">🏠</span>Home</button>
        <button class="nav-btn" data-nav="spirits" type="button"><span class="nav-icon" aria-hidden="true">🥃</span>My Spirits</button>
        <button class="nav-btn scan-btn" data-nav="scan" type="button"><span class="nav-icon-circle" aria-hidden="true">📷</span>Scan</button>
        <button class="nav-btn" data-nav="discover" type="button"><span class="nav-icon" aria-hidden="true">✨</span>Discover</button>
        <button class="nav-btn" data-nav="profile" type="button"><span class="nav-icon" aria-hidden="true">👤</span>Profile</button>
      </nav>

      <div id="sheetBackdrop" class="sheet-backdrop" data-action="close-sheet"></div>
      <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-handle"></div>
        <div id="sheetContent"></div>
      </div>

      <div id="toast" class="toast" hidden></div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
