name: Check
# Tests, build and size budgets on every pull request and on pushes to other branches (deploy.yml covers main),
# so a problem shows up before it can reach main.
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run check
