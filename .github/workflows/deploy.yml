# Deploy Pour Profile to Cloudflare Workers.
#
# Exists so deploying never depends on having a terminal and a logged-in wrangler
# on hand: pushing to main ships it. The manual trigger is there for re-running a
# deploy without a new commit (for example after changing a Cloudflare binding).
#
# Requires one repository secret: CLOUDFLARE_API_TOKEN, with the "Edit Cloudflare
# Workers" template plus D1 edit. Nothing else is read from the environment --
# account and bindings all come from wrangler.jsonc, which is committed.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A later push should win rather than race an in-flight deploy, but a running
# deploy is never cancelled midway -- a half-uploaded Worker is worse than a slow one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `npm install`, not `npm ci`: package-lock.json is gitignored in this repo,
      # so there is no lockfile in the checkout for `ci` to read.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Tests gate the deploy. The suite is fast and entirely offline, and it
      # covers the things most likely to ship a visible mistake -- wrong-expression
      # image matching, catalog identity, note attribution.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # The built shell, service worker and the two files the Worker reads must all exist, and the
      # front end must stay inside its size budget.
      - name: Check the build
        run: npm run check

      # Wrangler's own failure for a missing token is a bare exit code in a log
      # that is awkward to reach from a phone. Say it in one line instead.
      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing CLOUDFLARE_API_TOKEN::Tests and build passed; only the deploy is blocked. Add the secret under Settings -> Secrets and variables -> Actions, named CLOUDFLARE_API_TOKEN, using a Cloudflare 'Edit Cloudflare Workers' token with D1 edit. Then re-run from the Actions tab."
            exit 1
          fi
          echo "Credentials present."

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # A failed deploy opens (or updates) one issue, so it is noticed the same day; the next good deploy closes it.
      - name: Open an issue when the deploy fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Deploy failed"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "${{ github.repository }}" --body "$body"
          else gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"; fi

      - name: Close the failure issue after a good deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"Deploy failed\" in:title" --json number --jq '.[0].number // empty')
          [ -z "$n" ] || gh issue close "$n" --repo "${{ github.repository }}" --comment "The latest deploy succeeded."
